name: Admin checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/deployment-compatibility.test.mjs tests/deployment-admin.test.mjs
      - run: bash -n scripts/deploy-admin.sh tests/deploy-admin.test.sh
      - run: bash tests/deploy-admin.test.sh
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
      - run: pnpm run tsc
      - run: pnpm run build:prod

