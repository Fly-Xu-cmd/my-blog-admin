name: Build and Deploy Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build-and-deploy:
    needs: checks
    environment: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Verify API compatibility readiness
        env:
          API_READY: ${{ vars.BLOG_API_COMPAT_READY }}
        run: test "$API_READY" = "true"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 pnpm
        run: npm install -g pnpm@12.3.4

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com

      - name: 构建项目
        run: pnpm run build:prod

      - name: 通过 rsync 上传 dist 到服务器
        uses: burnett01/rsync-deployments@5.2.1
        with:
          switches: -avzr --delete
          path: dist
          remote_path: /home/www/my-blog-admin
          remote_host: ${{ secrets.ALIYUN_SERVER_IP }}
          remote_user: root
          remote_key: ${{ secrets.ALIYUN_SSH_KEY }}
